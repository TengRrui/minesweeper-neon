<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1220">
    <title>扫雷 · Neon Mines</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="ambient ambient--one" aria-hidden="true"></div>
    <div class="ambient ambient--two" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">
          <span>MINESWEEPER // 01</span>
          <span class="connection-indicator"><i></i> 本地运行</span>
        </p>
        <div class="hero-copy">
          <div>
            <h1>扫雷<span class="accent">。</span></h1>
            <p class="hero-subtitle">清空安全区，标记所有地雷。</p>
          </div>
          <div class="hero-mark" aria-hidden="true">
            <span>✦</span>
            <span>×</span>
            <span>◌</span>
          </div>
        </div>
      </header>

      <section class="game-card" aria-label="扫雷游戏">
        <div class="toolbar">
          <div class="control-group">
            <label for="difficulty">难度</label>
            <div class="select-wrap">
              <select id="difficulty" aria-label="选择难度">
                <option value="beginner">初级 · 9 × 9</option>
                <option value="intermediate">中级 · 16 × 16</option>
                <option value="expert">专家 · 30 × 16</option>
              </select>
            </div>
          </div>

          <div class="toolbar-actions">
            <button id="flag-mode" class="mode-toggle" type="button" aria-pressed="false">
              <span class="button-icon" aria-hidden="true">⚑</span>
              <span>标记模式</span>
            </button>
            <button id="new-game" class="primary-button" type="button">
              <span class="button-icon" aria-hidden="true">↻</span>
              <span>新游戏</span>
            </button>
          </div>
        </div>

        <div class="stats-grid" aria-label="游戏状态">
          <div class="stat-card">
            <span class="stat-label">剩余雷数</span>
            <strong id="mine-count" class="stat-value">10</strong>
            <span class="stat-detail">SAFE ZONE</span>
          </div>
          <div class="stat-card stat-card--timer">
            <span class="stat-label">用时</span>
            <strong id="timer" class="stat-value">000</strong>
            <span class="stat-detail">SECONDS</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">最佳记录</span>
            <strong id="best-time" class="stat-value">—</strong>
            <span class="stat-detail">LOCAL BEST</span>
          </div>
          <div id="game-status" class="status-chip" data-status="ready" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-text">准备开始</span>
          </div>
        </div>

        <div class="board-panel">
          <div class="board-heading">
            <div>
              <span class="section-kicker">ACTIVE FIELD</span>
              <h2>雷区扫描</h2>
            </div>
            <span id="board-size" class="board-size">9 × 9</span>
          </div>

          <div class="board-scroll" aria-label="扫雷棋盘">
            <div id="board" class="board" role="grid" aria-label="扫雷棋盘"></div>
          </div>

          <div class="game-note">
            <span class="note-mark" aria-hidden="true">i</span>
            <p id="live-region" role="status" aria-live="polite">点击任意格开始扫描，首击不会踩雷。</p>
          </div>
        </div>
      </section>

      <section class="help-strip" aria-label="操作说明">
        <div class="help-item">
          <span class="help-key" aria-hidden="true">L</span>
          <div><strong>揭示</strong><span>左键 / Enter</span></div>
        </div>
        <div class="help-item">
          <span class="help-key help-key--flag" aria-hidden="true">⚑</span>
          <div><strong>标记</strong><span>右键 / F</span></div>
        </div>
        <div class="help-item">
          <span class="help-key" aria-hidden="true">2×</span>
          <div><strong>快速扫描</strong><span>双击数字格</span></div>
        </div>
        <p class="help-tip">先清空安全格，再处理最后一颗雷。</p>
      </section>

      <footer class="footer-note">NEON MINES · 一切记录仅保存在当前浏览器</footer>
    </main>

    <div id="result-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="result-title">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <div class="modal-card">
        <div id="result-icon" class="result-icon" aria-hidden="true">✦</div>
        <span id="result-kicker" class="section-kicker">SCAN COMPLETE</span>
        <h2 id="result-title">区域已清空</h2>
        <p id="result-copy">所有安全格都已确认。</p>
        <button id="play-again" class="primary-button primary-button--wide" type="button">
          <span class="button-icon" aria-hidden="true">↻</span>
          <span>再来一局</span>
        </button>
      </div>
    </div>

    <script src="src/game-core.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
